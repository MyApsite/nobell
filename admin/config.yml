          - {name: title, widget: string}
          - {name: description, widget: text}
          - {name: keywords, widget: string, required: false}
          - {name: canonical, widget: string}
          - {name: og_image, widget: string}
          - {name: og_type, widget: string, default: website}
          - {name: og_title, widget: string}
          - {name: og_description, widget: text}
          - {name: twitter_title, widget: string}
          - {name: twitter_description, widget: text}
          - {name: hero_title, widget: string}
          - {name: hero_subtitle, widget: string}
          - name: hero_slides
            label: Hero slider (3 slides)
            widget: list
            fields:
              - {name: href, widget: string}
              - {name: image_base, widget: string}
              - {name: image_ext, widget: select, options: [jpg, png]}
              - {name: alt, widget: string, required: false}
              - {name: title, widget: string}
              - {name: text, widget: text}
          - {name: inline_style, widget: text, required: false}
          - {name: search_name, widget: string, default: cars-search}
          - {name: hidden_name, widget: string, default: cars-brand}
          - {name: card_selector, widget: string, default: .cars-grid .cars-grid__col}
          - {name: dropdown_button_label, widget: string}
          - {name: dropdown_default_option, widget: string}
          - name: dropdown_items
            widget: list
            fields:
              - {name: value, widget: string}
              - {name: label, widget: string}
          - name: filter_buttons
            widget: list
            fields:
              - {name: value, widget: string}
              - {name: label, widget: string}
              - {name: active, widget: boolean, default: false, required: false}
              - {name: dim, widget: string, default: type}
          - {name: total_results, widget: number, default: 12, value_type: int}
      - name: watches-index
        label: Watches — обложка каталога
        file: content/watches/_index.md
        fields:
          - {name: slug, widget: hidden, default: watches}
          - {name: title, widget: string}
          - {name: description, widget: text}
          - {name: keywords, widget: string, required: false}
          - {name: canonical, widget: string}
          - {name: og_image, widget: string}
          - {name: og_type, widget: string, default: website}
          - {name: og_title, widget: string}
          - {name: og_description, widget: text}
          - {name: twitter_title, widget: string}
          - {name: twitter_description, widget: text}
          - {name: hero_title, widget: string}
          - {name: hero_subtitle, widget: string}
          - {name: hero_slides, widget: list, fields: [{name: href, widget: string}, {name: image_base, widget: string}, {name: image_ext, widget: select, options: [jpg, png]}, {name: alt, widget: string, required: false}, {name: title, widget: string}, {name: text, widget: text}]}
          - {name: inline_style, widget: text, required: false}
          - {name: search_name, widget: string, default: watches-search}
          - {name: hidden_name, widget: string, default: watches-brand}
          - {name: dropdown_button_label, widget: string}
          - {name: dropdown_default_option, widget: string}
          - {name: dropdown_items, widget: list, fields: [{name: value, widget: string}, {name: label, widget: string}]}
          - {name: filter_buttons, widget: list, fields: [{name: value, widget: string}, {name: label, widget: string}, {name: active, widget: boolean, default: false, required: false}, {name: dim, widget: string, default: type}]}
          - {name: total_results, widget: number, default: 12, value_type: int}
      - name: guide-index
        label: Guide — обложка каталога
        file: content/guide/_index.md
        fields:
